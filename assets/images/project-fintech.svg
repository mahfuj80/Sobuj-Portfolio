<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fintechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#fintechBg)" stroke="#134e4a" stroke-width="2"/>
  
  <rect width="800" height="48" rx="16" fill="#041f1a"/>
  <rect y="36" width="800" height="12" fill="#041f1a"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#134e4a" stroke-width="1"/>
  
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>

  <rect x="110" y="12" width="400" height="24" rx="6" fill="#0f2f27"/>
  <text x="140" y="28" fill="#6ee7b7" font-family="monospace" font-size="11">POST /v1/payments/settle-payout [200 OK]</text>
  
  <rect x="635" y="14" width="135" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="702" y="28" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">API &amp; INTEGRATION</text>

  <!-- Content -->
  <g transform="translate(30, 68)">
    <!-- Left: Virtual Card & Quick Metrics -->
    <rect x="0" y="0" width="340" height="195" rx="16" fill="url(#cardGradient)" stroke="#34d399" stroke-width="1"/>
    <text x="24" y="38" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">VaultPay Multi-Currency</text>
    <text x="24" y="58" fill="#a7f3d0" font-family="sans-serif" font-size="11">Automated Escrow &amp; Stripe Connect</text>
    
    <text x="24" y="115" fill="#ecfdf5" font-family="monospace" font-size="18" letter-spacing="3">4839  ••••  ••••  9204</text>
    
    <text x="24" y="155" fill="#a7f3d0" font-family="sans-serif" font-size="10">BALANCE USD</text>
    <text x="24" y="175" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">$2,419,830.50</text>

    <text x="240" y="155" fill="#a7f3d0" font-family="sans-serif" font-size="10">EXPIRY</text>
    <text x="240" y="175" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">08/30</text>

    <!-- Right: Live Webhook & API Logs -->
    <rect x="365" y="0" width="375" height="195" rx="12" fill="#031d17" stroke="#134e4a"/>
    <text x="385" y="28" fill="#34d399" font-family="monospace" font-size="12" font-weight="600">⚡ Live Integration Stream</text>
    
    <rect x="385" y="44" width="335" height="36" rx="6" fill="#04271e"/>
    <circle cx="400" cy="62" r="4" fill="#10b981"/>
    <text x="415" y="66" fill="#ecfdf5" font-family="monospace" font-size="11">Stripe Checkout Success - $1,420</text>

    <rect x="385" y="88" width="335" height="36" rx="6" fill="#04271e"/>
    <circle cx="400" cy="106" r="4" fill="#10b981"/>
    <text x="415" y="110" fill="#ecfdf5" font-family="monospace" font-size="11">PayPal IPN Verified (Sandbox) - $850</text>

    <rect x="385" y="132" width="335" height="36" rx="6" fill="#04271e"/>
    <circle cx="400" cy="150" r="4" fill="#38bdf8"/>
    <text x="415" y="154" fill="#ecfdf5" font-family="monospace" font-size="11">QuickBooks Automated Invoice Generated</text>

    <!-- Bottom: Architecture Diagram -->
    <rect x="0" y="215" width="740" height="185" rx="12" fill="#031d17" stroke="#134e4a"/>
    <text x="20" y="242" fill="#f0fdf4" font-family="sans-serif" font-size="13" font-weight="600">High-Availability API Gateway Architecture</text>
    
    <!-- Node 1: Client App -->
    <rect x="25" y="260" width="130" height="60" rx="8" fill="#064e3b" stroke="#059669"/>
    <text x="90" y="288" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Client Apps</text>
    <text x="90" y="306" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">Mobile &amp; Web</text>

    <!-- Arrow -->
    <line x1="165" y1="290" x2="215" y2="290" stroke="#34d399" stroke-width="2" stroke-dasharray="4"/>

    <!-- Node 2: Rate Limiter & Auth Gateway -->
    <rect x="225" y="260" width="150" height="60" rx="8" fill="#064e3b" stroke="#059669"/>
    <text x="300" y="288" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">API Gateway</text>
    <text x="300" y="306" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">JWT &amp; Redis Throttle</text>

    <!-- Arrow -->
    <line x1="385" y1="290" x2="435" y2="290" stroke="#34d399" stroke-width="2" stroke-dasharray="4"/>

    <!-- Node 3: Microservices -->
    <rect x="445" y="260" width="140" height="60" rx="8" fill="#064e3b" stroke="#059669"/>
    <text x="515" y="288" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Worker Nodes</text>
    <text x="515" y="306" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">BullMQ &amp; Node.js</text>

    <!-- Arrow -->
    <line x1="595" y1="290" x2="635" y2="290" stroke="#34d399" stroke-width="2" stroke-dasharray="4"/>

    <!-- Node 4: 3rd Party APIs -->
    <rect x="645" y="260" width="85" height="60" rx="8" fill="#042f2e" stroke="#0d9488"/>
    <text x="687" y="288" fill="#5eead4" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">3rd-Party</text>
    <text x="687" y="306" fill="#99f6e4" font-family="sans-serif" font-size="9" text-anchor="middle">Stripe/Bank</text>

    <text x="25" y="365" fill="#6ee7b7" font-family="sans-serif" font-size="11">✓ Zero-Downtime Webhook Handling • 99.99% Guaranteed Delivery • AES-256 Encrypted Payload</text>
  </g>
</svg>
