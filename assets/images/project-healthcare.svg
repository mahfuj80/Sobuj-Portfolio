    <text x="375" y="222" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">11:15 AM</text>

    <!-- Appointment Item 4 -->
    <rect x="15" y="258" width="420" height="60" rx="8" fill="#0e233d"/>
    <circle cx="45" cy="288" r="16" fill="#10b981" fill-opacity="0.2"/>
    <text x="45" y="293" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">DW</text>
    <text x="75" y="280" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Dr. David Wong (Dermatology)</text>
