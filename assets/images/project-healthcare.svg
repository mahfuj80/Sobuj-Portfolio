      <text x="18" y="198" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Security &amp; HIPAA Compliance</text>
      <text x="18" y="225" fill="#10b981" font-family="sans-serif" font-size="11">🔒 End-to-End EHR Encryption (AES-256)</text>
      <text x="18" y="248" fill="#10b981" font-family="sans-serif" font-size="11">🛡️ Multi-Factor Authentication Active</text>
      <text x="18" y="271" fill="#10b981" font-family="sans-serif" font-size="11">⚡ Daily Automated Database Backups</text>
      <text x="18" y="294" fill="#38bdf8" font-family="sans-serif" font-size="11">☁️ Fast WebRTC Video Stream</text>
