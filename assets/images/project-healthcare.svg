      <rect x="18" y="100" width="244" height="6" rx="3" fill="#132a45"/>
      <rect x="18" y="100" width="200" height="6" rx="3" fill="#0284c7"/>
      <text x="18" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10">82% Patient Satisfaction Rate (Verified)</text>

