  </defs>

  <rect width="800" height="500" rx="16" fill="url(#healthBg)" stroke="#1e3a5f" stroke-width="2"/>
  
  <rect width="800" height="48" rx="16" fill="#091829"/>
  <rect y="36" width="800" height="12" fill="#091829"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#1e3a5f" stroke-width="1"/>
  
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>

