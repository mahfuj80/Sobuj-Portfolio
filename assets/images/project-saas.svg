<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Browser Header -->
  <rect width="800" height="48" rx="16" fill="#0b1120"/>
  <rect y="36" width="800" height="12" fill="#0b1120"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>

  <!-- URL Bar -->
  <rect x="110" y="12" width="400" height="24" rx="6" fill="#1e293b" opacity="0.8"/>
  <circle cx="126" cy="24" r="4" fill="#06b6d4"/>
  <text x="140" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">app.cloudscale-analytics.io/dashboard/v2</text>
  
  <!-- Badge -->
  <rect x="670" y="14" width="100" height="20" rx="10" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="720" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">LIVE SAAS</text>

  <!-- Sidebar -->
  <rect x="0" y="48" width="180" height="452" fill="#090e1a"/>
  <line x1="180" y1="48" x2="180" y2="500" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Sidebar Nav items -->
  <rect x="16" y="70" width="148" height="34" rx="8" fill="url(#primaryGrad)"/>
  <circle cx="34" cy="87" r="5" fill="#ffffff"/>
  <text x="50" y="91" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Dashboard</text>

  <rect x="16" y="114" width="148" height="32" rx="8" fill="#1e293b" opacity="0.4"/>
  <circle cx="34" cy="130" r="4" fill="#64748b"/>
  <text x="50" y="134" fill="#94a3b8" font-family="sans-serif" font-size="12">Real-time Data</text>

  <rect x="16" y="156" width="148" height="32" rx="8" fill="#1e293b" opacity="0.4"/>
  <circle cx="34" cy="172" r="4" fill="#64748b"/>
  <text x="50" y="176" fill="#94a3b8" font-family="sans-serif" font-size="12">Multi-Tenancy</text>

  <rect x="16" y="198" width="148" height="32" rx="8" fill="#1e293b" opacity="0.4"/>
  <circle cx="34" cy="214" r="4" fill="#64748b"/>
  <text x="50" y="218" fill="#94a3b8" font-family="sans-serif" font-size="12">API Webhooks</text>

  <rect x="16" y="240" width="148" height="32" rx="8" fill="#1e293b" opacity="0.4"/>
  <circle cx="34" cy="256" r="4" fill="#64748b"/>
  <text x="50" y="260" fill="#94a3b8" font-family="sans-serif" font-size="12">Settings &amp; Billing</text>

  <!-- Main Content Area -->
  <!-- Stats Row -->
  <g transform="translate(200, 68)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="180" height="80" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="500">Monthly Revenue</text>
    <text x="16" y="54" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="700">$128,450</text>
    <text x="120" y="52" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">+24.8%</text>

    <!-- Stat 2 -->
    <rect x="195" y="0" width="180" height="80" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="211" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="500">Active Tenants</text>
    <text x="211" y="54" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="700">1,482</text>
    <text x="315" y="52" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="600">+12 new</text>

    <!-- Stat 3 -->
    <rect x="390" y="0" width="185" height="80" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="406" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="500">System Uptime</text>
    <text x="406" y="54" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="700">99.98%</text>
    <text x="510" y="52" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">Optimal</text>
  </g>

  <!-- Big Chart Box -->
  <rect x="200" y="165" width="575" height="190" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="220" y="195" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Enterprise Throughput &amp; API Traffic</text>
  <text x="690" y="195" fill="#38bdf8" font-family="sans-serif" font-size="11">Real-time Stream</text>

  <!-- Grid lines -->
  <line x1="220" y1="230" x2="750" y2="230" stroke="#1e293b" stroke-dasharray="4"/>
  <line x1="220" y1="270" x2="750" y2="270" stroke="#1e293b" stroke-dasharray="4"/>
  <line x1="220" y1="310" x2="750" y2="310" stroke="#1e293b" stroke-dasharray="4"/>

  <!-- Chart Curve Area -->
  <path d="M 220 310 Q 280 280 340 290 T 460 230 T 580 205 T 700 190 L 750 185 L 750 330 L 220 330 Z" fill="url(#chartGrad)"/>
  <path d="M 220 310 Q 280 280 340 290 T 460 230 T 580 205 T 700 190 L 750 185" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#glow)"/>

  <!-- Data points -->
  <circle cx="460" cy="230" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  <circle cx="580" cy="205" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="700" cy="190" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

  <!-- Bottom Mini Cards -->
  <rect x="200" y="370" width="280" height="105" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="216" y="396" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Database Clustering &amp; Caching</text>
  <rect x="216" y="415" width="248" height="8" rx="4" fill="#1e293b"/>
  <rect x="216" y="415" width="195" height="8" rx="4" fill="#06b6d4"/>
  <text x="216" y="445" fill="#94a3b8" font-family="sans-serif" font-size="11">PostgreSQL + Redis Cache Layer (78% Hit Rate)</text>

  <rect x="495" y="370" width="280" height="105" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="511" y="396" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Security &amp; Webhook Events</text>
  <text x="511" y="425" fill="#10b981" font-family="sans-serif" font-size="11">✓ SSL / TLS 1.3 Active &amp; Verified</text>
  <text x="511" y="445" fill="#94a3b8" font-family="sans-serif" font-size="11">✓ 142 Webhooks dispatched in &lt;18ms</text>
</svg>
