<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B" />
      <stop offset="50%" stop-color="#0175C2" />
      <stop offset="100%" stop-color="#13B9FD" />
    </linearGradient>
    <linearGradient id="tauriGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC131" />
      <stop offset="100%" stop-color="#24C8DB" />
    </linearGradient>
    <linearGradient id="phoneCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2e" />
      <stop offset="100%" stop-color="#08101e" />
    </linearGradient>
    <linearGradient id="accentCyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Canvas Container -->
  <rect width="800" height="500" rx="16" fill="url(#mBgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Background decorative grid lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- LEFT: Desktop App Window (Tauri Showcase) -->
  <g transform="translate(40, 45)">
    <!-- Desktop Window Frame -->
    <rect width="450" height="410" rx="12" fill="#0b1322" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect width="450" height="38" rx="12" fill="#080e1a"/>
    <rect y="26" width="450" height="12" fill="#080e1a"/>
    <line x1="0" y1="38" x2="450" y2="38" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>

    <!-- Tauri Logo & App Name -->
    <text x="76" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="700">TaskPulse Desktop</text>
    <rect x="200" y="9" width="90" height="20" rx="10" fill="#24C8DB" fill-opacity="0.15" stroke="#24C8DB" stroke-opacity="0.4"/>
    <text x="245" y="23" fill="#24C8DB" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡ TAURI APP</text>

    <!-- App Header Metric Cards -->
    <rect x="20" y="55" width="125" height="65" rx="8" fill="#111d33" stroke="#1e293b" stroke-width="1"/>
    <text x="32" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">Active Tasks</text>
    <text x="32" y="102" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="800">1,428</text>

    <rect x="160" y="55" width="125" height="65" rx="8" fill="#111d33" stroke="#1e293b" stroke-width="1"/>
    <text x="172" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">Sync Speed</text>
    <text x="172" y="102" fill="#10b981" font-family="sans-serif" font-size="20" font-weight="800">12 ms</text>

    <rect x="300" y="55" width="130" height="65" rx="8" fill="#111d33" stroke="#1e293b" stroke-width="1"/>
    <text x="312" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">Memory Usage</text>
    <text x="312" y="102" fill="#a78bfa" font-family="sans-serif" font-size="20" font-weight="800">28 MB</text>

    <!-- Real-Time Activity Feed -->
    <rect x="20" y="135" width="410" height="150" rx="8" fill="#0f192b" stroke="#1e293b" stroke-width="1"/>
    <text x="36" y="160" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="700">Cross-Platform Sync Engine</text>
    <text x="36" y="178" fill="#64748b" font-family="sans-serif" font-size="10">Shared Rust &amp; NestJS State Pipeline</text>

    <!-- Activity Item 1 -->
    <circle cx="45" cy="205" r="5" fill="#10b981"/>
    <text x="60" y="209" fill="#cbd5e1" font-family="sans-serif" font-size="11">macOS / Windows Client connected via WebSockets</text>
    <text x="380" y="209" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">Just now</text>

    <!-- Activity Item 2 -->
    <circle cx="45" cy="235" r="5" fill="#38bdf8"/>
    <text x="60" y="239" fill="#cbd5e1" font-family="sans-serif" font-size="11">Flutter iOS &amp; Android clients synced 48 offline changes</text>
    <text x="380" y="239" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">2s ago</text>

    <!-- Activity Item 3 -->
    <circle cx="45" cy="265" r="5" fill="#818cf8"/>
    <text x="60" y="269" fill="#cbd5e1" font-family="sans-serif" font-size="11">NestJS backend dispatched push notification token</text>
    <text x="380" y="269" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">12s ago</text>

    <!-- Bottom Action Bar -->
    <rect x="20" y="300" width="410" height="90" rx="8" fill="#0a101d" stroke="#1e293b" stroke-width="1"/>
    <rect x="36" y="316" width="120" height="28" rx="6" fill="url(#tauriGrad)"/>
    <text x="96" y="335" fill="#080f1e" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">TAURI DESKTOP</text>

    <rect x="168" y="316" width="110" height="28" rx="6" fill="#1e293b"/>
    <text x="223" y="335" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">NESTJS API</text>

    <rect x="290" y="316" width="125" height="28" rx="6" fill="#1e293b"/>
    <text x="352" y="335" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">SQLITE CACHE</text>

    <text x="36" y="372" fill="#94a3b8" font-family="sans-serif" font-size="10">Native Windows (.msi), macOS (.dmg), Linux (.appimage)</text>
  </g>

  <!-- RIGHT: Mobile Phone Frame (Flutter & Dart Showcase) -->
  <g transform="translate(520, 30)">
    <!-- Phone Outer Shell -->
    <rect width="240" height="440" rx="36" fill="#0f172a" stroke="#334155" stroke-width="3" filter="url(#mGlow)"/>
    <!-- Phone Inner Screen -->
    <rect x="8" y="8" width="224" height="424" rx="28" fill="url(#phoneCardGrad)"/>

    <!-- Phone Notch / Dynamic Island -->
    <rect x="80" y="16" width="80" height="18" rx="9" fill="#020617"/>
    <circle cx="140" cy="25" r="3" fill="#1e293b"/>

    <!-- Flutter Status Bar -->
    <text x="24" y="28" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">9:41</text>
    <g transform="translate(195, 20)">
      <rect width="16" height="8" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
      <rect x="2" y="2" width="10" height="4" fill="#10b981"/>
    </g>

    <!-- Flutter Logo & App Title -->
    <g transform="translate(20, 50)">
      <!-- Mini Flutter Logo SVG shape -->
      <path d="M 14 0 L 0 14 L 4.5 18.5 L 23 0 Z" fill="#42A5F5"/>
      <path d="M 8.5 14 L 4 18.5 L 12.5 27 L 17 22.5 Z" fill="#0D47A1"/>
      <path d="M 12.5 27 L 8 31.5 L 14 37.5 L 18.5 33 Z" fill="#42A5F5"/>
      <path d="M 17 22.5 L 12.5 27 L 18.5 33 L 23 28.5 Z" fill="#01579B"/>
      <text x="32" y="18" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">TaskPulse Mobile</text>
      <text x="32" y="32" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">Flutter • Dart • iOS &amp; Android</text>
    </g>

    <!-- Mobile Card 1: Today's Summary -->
    <rect x="18" y="100" width="204" height="75" rx="14" fill="url(#accentCyanViolet)" opacity="0.9"/>
    <text x="30" y="122" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Cross-Platform Sync</text>
    <text x="30" y="145" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">100% Up to Date</text>
    <text x="30" y="162" fill="rgba(255,255,255,0.85)" font-family="sans-serif" font-size="9">Flutter 60 FPS Native Renderer</text>

    <!-- Mobile Card 2: Task Items -->
    <rect x="18" y="188" width="204" height="44" rx="10" fill="#162238" stroke="#1e293b" stroke-width="1"/>
    <circle cx="34" cy="210" r="7" fill="#10b981"/>
    <path d="M 31 210 L 33 212 L 37 208" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <text x="48" y="208" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600">Push Notifications</text>
    <text x="48" y="222" fill="#64748b" font-family="sans-serif" font-size="8">Firebase FCM • iOS APNs</text>

    <rect x="18" y="240" width="204" height="44" rx="10" fill="#162238" stroke="#1e293b" stroke-width="1"/>
    <circle cx="34" cy="262" r="7" fill="#06b6d4"/>
    <path d="M 31 262 L 33 264 L 37 260" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <text x="48" y="260" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600">Offline SQLite Cache</text>
    <text x="48" y="274" fill="#64748b" font-family="sans-serif" font-size="8">Automatic Cloud Resync</text>

    <rect x="18" y="292" width="204" height="44" rx="10" fill="#162238" stroke="#1e293b" stroke-width="1"/>
    <circle cx="34" cy="314" r="7" fill="#818cf8"/>
    <path d="M 31 314 L 33 316 L 37 312" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <text x="48" y="312" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600">NestJS Enterprise API</text>
    <text x="48" y="326" fill="#64748b" font-family="sans-serif" font-size="8">RESTful &amp; GraphQL Auth</text>

    <!-- Bottom Navigation Bar -->
    <rect x="18" y="355" width="204" height="45" rx="12" fill="#0a101d" stroke="#1e293b" stroke-width="1"/>
    <circle cx="50" cy="378" r="9" fill="#06b6d4"/>
    <circle cx="95" cy="378" r="6" fill="#475569"/>
    <circle cx="140" cy="378" r="6" fill="#475569"/>
    <circle cx="185" cy="378" r="6" fill="#475569"/>

    <!-- Home indicator -->
    <rect x="75" y="415" width="90" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- Decorative Badge Overlay -->
  <g transform="translate(370, 395)">
    <rect width="180" height="34" rx="17" fill="#0d1b2e" stroke="#06b6d4" stroke-width="1.5" filter="url(#mGlow)"/>
    <text x="90" y="21" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">FLUTTER + TAURI STACK</text>
  </g>
</svg>
