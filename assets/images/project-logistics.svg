<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="logisticsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#logisticsBg)" stroke="#27272a" stroke-width="2"/>
  
  <rect width="800" height="48" rx="16" fill="#18181b"/>
  <rect y="36" width="800" height="12" fill="#18181b"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#27272a" stroke-width="1"/>
  
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>

  <rect x="110" y="12" width="400" height="24" rx="6" fill="#27272a"/>
  <text x="140" y="28" fill="#d4d4d8" font-family="sans-serif" font-size="11">fleettrack-iot.com/live-map/dispatch-routes</text>
  
  <rect x="635" y="14" width="135" height="20" rx="10" fill="#ea580c" fill-opacity="0.2" stroke="#ea580c" stroke-opacity="0.5"/>
  <text x="702" y="28" fill="#fb923c" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">CUSTOM LOGISTICS</text>

  <!-- Content -->
  <g transform="translate(25, 68)">
    <!-- Map Simulation Canvas -->
    <rect x="0" y="0" width="510" height="400" rx="12" fill="#18181b" stroke="#3f3f46"/>
    
    <!-- Map Roads / Grid Lines -->
    <path d="M 30 180 Q 150 120 280 200 T 480 140" fill="none" stroke="#27272a" stroke-width="18"/>
    <path d="M 30 180 Q 150 120 280 200 T 480 140" fill="none" stroke="#52525b" stroke-width="2" stroke-dasharray="6"/>

    <path d="M 120 40 L 140 380" fill="none" stroke="#27272a" stroke-width="14"/>
    <path d="M 380 40 L 370 380" fill="none" stroke="#27272a" stroke-width="14"/>
    <path d="M 60 300 Q 220 340 450 290" fill="none" stroke="#27272a" stroke-width="14"/>

    <!-- Active Route Glowing -->
    <path d="M 130 150 L 220 180 L 310 215 L 375 160 L 440 145" fill="none" stroke="#f97316" stroke-width="4"/>

    <!-- Fleet Markers -->
    <circle cx="130" cy="150" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <circle cx="310" cy="215" r="12" fill="#f97316" stroke="#ffffff" stroke-width="3"/>
    <text x="310" y="242" fill="#fed7aa" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">TRUCK #88 (48 mph)</text>

    <circle cx="440" cy="145" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

    <!-- Floating HUD card on map -->
    <rect x="20" y="20" width="220" height="75" rx="8" fill="#09090b" fill-opacity="0.9" stroke="#3f3f46"/>
    <text x="35" y="44" fill="#fafafa" font-family="sans-serif" font-size="12" font-weight="700">Route Optimization Engine</text>
    <text x="35" y="62" fill="#10b981" font-family="sans-serif" font-size="11">✓ Fuel efficiency improved by 22%</text>
    <text x="35" y="78" fill="#a1a1aa" font-family="sans-serif" font-size="10">Avg ETA deviation: &lt; 3.2 mins</text>

    <!-- Right Side Panel -->
    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="220" height="190" rx="12" fill="#18181b" stroke="#3f3f46"/>
      <text x="16" y="28" fill="#fafafa" font-family="sans-serif" font-size="13" font-weight="700">Fleet Telematics</text>
      
      <rect x="16" y="45" width="188" height="38" rx="6" fill="#27272a"/>
      <text x="26" y="62" fill="#a1a1aa" font-family="sans-serif" font-size="10">Active GPS Nodes</text>
      <text x="26" y="77" fill="#fafafa" font-family="sans-serif" font-size="14" font-weight="700">124 / 128 Online</text>

      <rect x="16" y="92" width="188" height="38" rx="6" fill="#27272a"/>
      <text x="26" y="109" fill="#a1a1aa" font-family="sans-serif" font-size="10">Deliveries Completed Today</text>
      <text x="26" y="124" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="700">918 orders</text>

      <rect x="16" y="139" width="188" height="38" rx="6" fill="#27272a"/>
      <text x="26" y="156" fill="#a1a1aa" font-family="sans-serif" font-size="10">Driver Safety Index</text>
      <text x="26" y="171" fill="#f97316" font-family="sans-serif" font-size="14" font-weight="700">98.4 / 100</text>

      <rect x="0" y="205" width="220" height="195" rx="12" fill="#18181b" stroke="#3f3f46"/>
      <text x="16" y="232" fill="#fafafa" font-family="sans-serif" font-size="13" font-weight="700">IoT Integration Stack</text>
      <text x="16" y="258" fill="#e4e4e7" font-family="sans-serif" font-size="11">🛰️ MQTT / WebSockets Realtime</text>
      <text x="16" y="280" fill="#e4e4e7" font-family="sans-serif" font-size="11">🗺️ Mapbox GL Vector Tiles</text>
      <text x="16" y="302" fill="#e4e4e7" font-family="sans-serif" font-size="11">⚙️ Automated Geofence Alerts</text>
      <text x="16" y="324" fill="#e4e4e7" font-family="sans-serif" font-size="11">📊 Export to SAP / ERP API</text>
      <text x="16" y="360" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">✓ Low Latency &lt;50ms</text>
    </g>
  </g>
</svg>
