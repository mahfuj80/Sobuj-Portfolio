  <rect y="36" width="800" height="12" fill="#0f172a"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#334155" stroke-width="1"/>
  
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>

  <rect x="110" y="12" width="400" height="24" rx="6" fill="#1e293b"/>
  <text x="140" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">internal.omnicore-erp.net/operations/leads</text>
  
  <rect x="640" y="14" width="130" height="20" rx="10" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.5"/>
